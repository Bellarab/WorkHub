<div class="calendar-container">
  <div class="calendar-header">
    <h1>Task Calendar</h1>
    <div class="calendar-controls">
      <button class="nav-btn" (click)="previousMonth()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
          />
        </svg>
      </button>
      <h2>{{ monthNames[currentDate.getMonth()] }} {{ currentDate.getFullYear() }}</h2>
      <button class="nav-btn" (click)="nextMonth()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          />
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <p>Loading tasks...</p>
  </div>

  <div *ngIf="!isLoading" class="calendar-wrapper">
    <div class="calendar-weekdays">
      <div *ngFor="let day of weekDays" class="weekday">{{ day }}</div>
    </div>

    <div class="calendar-grid">
      <div
        *ngFor="let calDay of calendarDays"
        class="calendar-day"
        [class.other-month]="!calDay.isCurrentMonth"
        [class.today]="calDay.isToday"
      >
        <div class="day-number">{{ calDay.day }}</div>
        <div class="day-tasks">
          <div
            *ngFor="let task of calDay.tasks"
            class="task-item"
            [style.border-left-color]="task.projectColor"
            [class]="getStatusClass(task.status)"
            (click)="navigateToTask(task)"
            [title]="task.title + ' - ' + task.projectTitle"
          >
            <span class="task-title">{{ task.title }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
