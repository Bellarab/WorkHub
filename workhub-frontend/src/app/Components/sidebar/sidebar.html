<aside class="sidebar">
  <div class="sidebar-header">
    <h1>WorkHub</h1>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of menuItems">
        <a [routerLink]="['/', item.view]" routerLinkActive="active">
          {{ item.label }}
        </a>
      </li>

      <li *ngIf="currentUser.role === 'ADMIN'">
        <a routerLink="/admin" routerLinkActive="active"> Admin Panel </a>
      </li>

      <li class="settings-item">
        <button>Settings</button>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <img [src]="currentUser.avatar" [alt]="currentUser.firstName + ' ' + currentUser.lastName" />
      <div class="user-details">
        <p class="user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</p>
        <p class="user-email">{{ currentUser.email }}</p>
      </div>
    </div>

    <button class="role-toggle" (click)="onToggleRole()">Role: {{ currentUser.role }}</button>
    <button class="btn-logout" (click)="onLogout()">Logout</button>
  </div>
</aside>
